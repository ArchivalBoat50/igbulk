<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instagram Bulk Downloader</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fafafa; --panel: #fff; --line: #e4e4e7; --text: #18181b;
    --dim: #71717a; --accent: #c13584; --accent-2: #f56040;
    --ok: #15803d; --warn: #b45309; --err: #b91c1c; --skip: #6366f1;
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0c0e; --panel: #16161a; --line: #2a2a31; --text: #f4f4f5;
      --dim: #a1a1aa; --ok: #4ade80; --warn: #fbbf24; --err: #f87171; --skip: #a5b4fc;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    padding: 28px 20px 64px;
  }
  .wrap { max-width: 940px; margin: 0 auto; }
  header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 22px; flex-wrap: wrap; }
  h1 {
    font-size: 21px; margin: 0; letter-spacing: -0.02em;
    background: linear-gradient(92deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { color: var(--dim); font-size: 13px; }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 16px; margin-bottom: 16px;
  }
  textarea {
    width: 100%; min-height: 168px; resize: vertical; padding: 12px 14px;
    border: 1px solid var(--line); border-radius: 10px; background: transparent;
    color: inherit; font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  textarea:focus, input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .row + .row { margin-top: 10px; }
  label.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--dim); }
  input[type=text], select {
    padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px;
    background: transparent; color: inherit; font-size: 13px; font-family: inherit;
  }
  input[type=text] { min-width: 280px; }
  .check { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--dim); }
  button {
    font: inherit; font-size: 14px; font-weight: 550; padding: 9px 18px;
    border-radius: 9px; border: 1px solid var(--line); background: var(--panel);
    color: inherit; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button.primary {
    background: linear-gradient(92deg, var(--accent), var(--accent-2));
    color: #fff; border-color: transparent;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.sm { font-size: 12px; padding: 5px 11px; font-weight: 450; }
  .spacer { flex: 1; }
  .hint { font-size: 12px; color: var(--dim); margin-top: 8px; }
  .bar {
    height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 7px;
  }
  .bar > i {
    display: block; height: 100%; width: 0;
    background: linear-gradient(92deg, var(--accent), var(--accent-2));
    transition: width .25s ease;
  }
  ul.items { list-style: none; margin: 0; padding: 0; }
  ul.items li { padding: 11px 2px; border-top: 1px solid var(--line); }
  ul.items li:first-child { border-top: 0; }
  .item-top { display: flex; align-items: center; gap: 9px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none; }
  .dot.running, .dot.waiting { background: var(--accent); animation: pulse 1.1s infinite; }
  .dot.done { background: var(--ok); } .dot.skipped { background: var(--skip); }
  .dot.failed { background: var(--err); } .dot.blocked { background: var(--warn); }
  .dot.canceled { background: var(--dim); }
  @keyframes pulse { 50% { opacity: .3; } }
  .code { font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  .who { color: var(--dim); font-size: 12px; }
  .msg { font-size: 12px; color: var(--dim); margin-left: 17px; }
  .msg.failed, .msg.blocked { color: var(--err); }
  .files { margin: 5px 0 0 17px; font-size: 12px; }
  .files a { color: var(--accent); text-decoration: none; }
  .files a:hover { text-decoration: underline; }
  .tag {
    font-size: 10px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--dim); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px;
  }
  .summary { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; align-items: center; }
  .summary b { font-variant-numeric: tabular-nums; }
  .empty { color: var(--dim); font-size: 13px; text-align: center; padding: 22px 0; }
  .toast {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 8px;
    font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .toast.show { opacity: 1; }
  details.api { margin-top: 8px; }
  details.api summary { cursor: pointer; font-size: 13px; color: var(--dim); }
  pre {
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    padding: 11px; overflow-x: auto; font-size: 12px; margin: 9px 0 0;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Instagram Bulk Downloader</h1>
    <span class="sub" id="engine"></span>
  </header>

  <div class="card">
    <textarea id="input" spellcheck="false"
      placeholder="Paste any number of Reel or post links — one per line, or all jumbled together in a chat log. Duplicates and tracking parameters are cleaned up automatically.

https://www.instagram.com/reel/DAbc123XyZ/
https://www.instagram.com/p/DXyz789Abc/?igsh=tracking"></textarea>
    <div class="row" style="margin-top:12px">
      <label class="field">Save to
        <input type="text" id="dest" spellcheck="false">
      </label>
      <label class="field">At once
        <select id="concurrency">
          <option value="1">1 — safest</option>
          <option value="3" selected>3 — balanced</option>
          <option value="5">5</option>
          <option value="8">8 — may rate-limit</option>
        </select>
      </label>
      <label class="field">Cookie file
        <input type="text" id="cookiefile" spellcheck="false"
               placeholder="~/.igbulk-cookies.txt" style="min-width:200px">
      </label>
      <label class="field">…or cookies from
        <select id="cookies">
          <option value="">None (public only)</option>
          <option value="chrome">Chrome</option>
          <option value="safari">Safari</option>
          <option value="firefox">Firefox</option>
          <option value="brave">Brave</option>
          <option value="edge">Edge</option>
        </select>
      </label>
      <label class="check"><input type="checkbox" id="audio"> Audio only (mp3)</label>
      <label class="check"><input type="checkbox" id="skip" checked> Skip already downloaded</label>
      <label class="check" title="Instagram's 1080p Reels are VP9, which QuickTime and most editors can't play">
        <input type="checkbox" id="h264" checked> Convert to h264</label>
    </div>
    <div class="row" style="margin-top:14px">
      <button class="primary" id="go">Download</button>
      <button class="sm" id="clear">Clear</button>
      <span class="spacer"></span>
      <span class="sub" id="parsed">No links yet</span>
    </div>
    <div class="hint" id="hint"></div>
  </div>

  <div class="card" id="progress" hidden>
    <div class="summary">
      <span><b id="s-done">0</b>/<b id="s-total">0</b> done</span>
      <span class="sub" id="s-detail"></span>
      <span class="spacer"></span>
      <button class="sm" id="cancel" hidden>Cancel</button>
      <button class="sm" id="retry" hidden>Retry failed</button>
      <button class="sm" id="copy" hidden>Copy paths</button>
      <button class="sm" id="reveal" hidden>Open folder</button>
    </div>
    <div class="bar"><i id="s-bar"></i></div>
    <ul class="items" id="items"></ul>
  </div>

  <details class="api">
    <summary>Agent / API usage</summary>
    <pre id="api-doc">loading…</pre>
  </details>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
let jobId = null, polling = false, lastVersion = 0, defaults = {};

function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2200);
}

function fmtBytes(n) {
  if (!n) return '';
  const u = ['B', 'KB', 'MB', 'GB'];
  let i = 0, v = n;
  while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
  return `${v < 10 && i > 0 ? v.toFixed(1) : Math.round(v)} ${u[i]}`;
}

async function api(path, body) {
  const res = await fetch(path, body ? {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body),
  } : {});
  const data = await res.json().catch(() => ({error: 'Bad response'}));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

// --- live link parsing as you type -------------------------------------------
let parseTimer = null;
$('input').addEventListener('input', () => {
  clearTimeout(parseTimer);
  parseTimer = setTimeout(refreshParse, 220);
});

async function refreshParse() {
  const text = $('input').value;
  if (!text.trim()) {
    $('parsed').textContent = 'No links yet';
    $('hint').textContent = '';
    return;
  }
  try {
    const data = await api('/api/parse', {text});
    const bits = [`${data.count} link${data.count === 1 ? '' : 's'}`];
    if (data.duplicates) bits.push(`${data.duplicates} duplicate removed`.replace('removed', data.duplicates === 1 ? 'removed' : 's removed'));
    $('parsed').textContent = bits.join(' · ');
    const notes = [];
    const authed = Boolean($('cookies').value || $('cookiefile').value.trim());
    // Profiles are refused regardless of cookies; stories/highlights only need auth.
    const profiles = data.links.filter(l => l.kind === 'profile').length;
    const needAuth = data.links.filter(l => !l.supported && l.kind !== 'profile').length;
    if (profiles) notes.push(`${profiles} profile link${profiles === 1 ? '' : 's'} will be skipped — paste individual post links instead.`);
    if (needAuth && !authed) notes.push(`${needAuth} need a login (stories/highlights) — set a cookie file or browser, or they'll be skipped.`);
    if (data.rejected.length) notes.push(`Ignored ${data.rejected.length} unrecognised Instagram URL${data.rejected.length === 1 ? '' : 's'}.`);
    $('hint').textContent = notes.join(' ');
  } catch (e) { /* typing races are harmless */ }
}

// --- start a job -------------------------------------------------------------
$('go').addEventListener('click', async () => {
  const text = $('input').value;
  if (!text.trim()) { toast('Paste some links first'); return; }
  $('go').disabled = true;
  try {
    const job = await api('/api/jobs', {
      text,
      dest: $('dest').value.trim() || undefined,
      concurrency: Number($('concurrency').value),
      cookie_file: $('cookiefile').value.trim() || undefined,
      cookies_from: $('cookies').value || null,
      audio_only: $('audio').checked,
      skip_existing: $('skip').checked,
      ensure_h264: $('h264').checked,
    });
    jobId = job.job_id;
    lastVersion = 0;
    $('progress').hidden = false;
    render(job);
    if (!polling) poll();
  } catch (e) {
    toast(e.message);
    $('go').disabled = false;
  }
});

$('clear').addEventListener('click', () => {
  $('input').value = ''; refreshParse(); $('input').focus();
});
$('cancel').addEventListener('click', async () => {
  if (jobId) { await api(`/api/jobs/${jobId}/cancel`, {}); toast('Canceling…'); }
});
$('retry').addEventListener('click', async () => {
  if (!jobId) return;
  try {
    const job = await api(`/api/jobs/${jobId}/retry`, {});
    jobId = job.job_id; lastVersion = 0; render(job);
    if (!polling) poll();
  } catch (e) { toast(e.message); }
});
$('copy').addEventListener('click', () => {
  const paths = [...document.querySelectorAll('[data-path]')].map(a => a.dataset.path);
  navigator.clipboard.writeText(paths.join('\n'))
    .then(() => toast(`Copied ${paths.length} path${paths.length === 1 ? '' : 's'}`))
    .catch(() => toast('Copy failed'));
});
$('reveal').addEventListener('click', async () => {
  try { await api('/api/reveal', {path: $('dest').value.trim()}); }
  catch (e) { toast(e.message); }
});

// --- long-poll for state -----------------------------------------------------
async function poll() {
  polling = true;
  while (jobId) {
    try {
      const job = await api(`/api/jobs/${jobId}?since=${lastVersion}&wait=25`);
      lastVersion = job.version || lastVersion;
      render(job);
      if (job.complete) { $('go').disabled = false; }
    } catch (e) {
      await new Promise(r => setTimeout(r, 1500));
    }
  }
  polling = false;
}

const STATUS_TEXT = {
  queued: 'Queued', running: 'Working', waiting: 'Waiting',
  done: 'Done', skipped: 'Already saved', failed: 'Failed',
  canceled: 'Canceled', blocked: 'Needs login',
};

function render(job) {
  $('s-total').textContent = job.total;
  const ok = job.counts.done + job.counts.skipped;
  $('s-done').textContent = ok;
  const pieces = [];
  if (job.counts.failed) pieces.push(`${job.counts.failed} failed`);
  if (job.counts.blocked) pieces.push(`${job.counts.blocked} need login`);
  if (job.bytes) pieces.push(fmtBytes(job.bytes));
  if (job.complete) pieces.push('finished');
  $('s-detail').textContent = pieces.join(' · ');
  $('s-bar').style.width = `${job.total ? (job.settled / job.total) * 100 : 0}%`;
  $('cancel').hidden = job.complete;
  $('retry').hidden = !(job.complete && (job.counts.failed || job.counts.canceled));
  $('copy').hidden = $('reveal').hidden = !job.files.length;

  $('items').innerHTML = job.items.map(item => {
    const files = (item.files || []).map(f =>
      `<a href="/files/${fileHref(f.rel)}" target="_blank" data-path="${esc(f.path)}">${esc(f.name)}</a>
       <span class="sub">${fmtBytes(f.size)}</span>`).join(' · ');
    const pct = item.status === 'running' && item.percent != null
      ? `<div class="bar"><i style="width:${item.percent}%"></i></div>` : '';
    const rate = [item.speed, item.eta ? `ETA ${item.eta}` : null].filter(Boolean).join(' · ');
    return `<li>
      <div class="item-top">
        <span class="dot ${item.status}"></span>
        <span class="code">${esc(item.label)}</span>
        <span class="tag">${esc(item.kind_label)}</span>
        ${item.uploader ? `<span class="who">@${esc(item.uploader)}</span>` : ''}
        <span class="spacer"></span>
        <span class="sub">${STATUS_TEXT[item.status] || item.status}${rate ? ' · ' + esc(rate) : ''}</span>
      </div>
      ${pct}
      ${item.message && item.status !== 'done' ? `<div class="msg ${item.status}">${esc(item.message)}</div>` : ''}
      ${files ? `<div class="files">${files}</div>` : ''}
    </li>`;
  }).join('');
}

// Encode each segment so '#', '?' and spaces in filenames survive.
function fileHref(rel) {
  return String(rel || '').split('/').map(encodeURIComponent).join('/');
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
}

// --- boot --------------------------------------------------------------------
(async () => {
  try {
    const info = await api('/api/health');
    defaults = info;
    $('dest').value = info.dest;
    $('engine').textContent = `yt-dlp ${info.ytdlp_version || '?'} · saving under ${info.dest}`;
    $('api-doc').textContent = info.agent_hint;
    if (info.cookie_file) $('cookiefile').value = info.cookie_file;
    if (info.cookies_from) $('cookies').value = info.cookies_from;
    if (info.cookies_recommended) {
      $('hint').textContent = info.cookies_notice;
      const mark = () => {
        const set = $('cookies').value || $('cookiefile').value.trim();
        const style = set ? '' : '2px solid var(--accent)';
        $('cookies').style.outline = style;
        $('cookiefile').style.outline = style;
      };
      mark();
      // Re-run the parse so the hint reflects the new auth state too.
      const onAuthChange = () => { mark(); refreshParse(); };
      $('cookies').addEventListener('change', onAuthChange);
      $('cookiefile').addEventListener('input', onAuthChange);
    }
  } catch (e) {
    $('engine').textContent = 'Server unreachable';
  }
  $('input').focus();
})();
</script>
</body>
</html>
